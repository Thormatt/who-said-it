entity: HLM-512 trial of tirnapexil (fictional)
packet:
  - id: E1
    text: The HLM-512 trial compared tirnapexil with placebo in adults with resistant hypertension.
  - id: E2
    text: 618 participants were randomized, 309 to tirnapexil and 309 to placebo.
  - id: E3
    text: Mean baseline systolic blood pressure was 154 mmHg.
  - id: E4
    text: At week 16, mean systolic blood pressure fell by 13.6 mmHg in the tirnapexil arm.
  - id: E5
    text: In the placebo arm, mean systolic blood pressure fell by 5.1 mmHg at week 16.
  - id: E6
    text: Hyperkalaemia was reported in 19 tirnapexil participants and 4 placebo participants.
  - id: E7
    text: The trial was conducted at 41 sites in six countries.
  - id: E8
    text: Median age at enrolment was 63 years.
question: By how much did mean systolic blood pressure fall in the tirnapexil arm at week 16, and how many tirnapexil participants had hyperkalaemia?
gold_answer: Mean systolic blood pressure fell by 13.6 mmHg in the tirnapexil arm; 19 tirnapexil participants had hyperkalaemia.
