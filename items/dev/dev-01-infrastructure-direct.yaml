entity: Calderbrook Water Treatment Plant (fictional)
packet:
  - id: E1
    text: The Calderbrook Water Treatment Plant was commissioned in 1998 and serves about 140,000 residents.
  - id: E2
    text: In 2021 the regional utility board approved a 38 million euro upgrade to add ultraviolet disinfection.
  - id: E3
    text: The upgrade raises the plant's design capacity from 45 million litres per day to 62 million litres per day.
  - id: E4
    text: Construction on the upgrade began in April 2022.
  - id: E5
    text: A contractor dispute halted work for 5 months in 2023.
  - id: E6
    text: The plant's 2024 annual report lists 11 full-time operators.
  - id: E7
    text: The board's target for the upgraded plant is at most 2 boil-water advisories per year.
question: What is the upgraded plant's design capacity, and how long was work halted by the contractor dispute?
gold_answer: 62 million litres per day; work was halted for 5 months.
