packet:
  - id: E1
    text: The NVX-204 trial tested peloxatril against placebo in adults with chronic migraine.
  - id: E2
    text: The trial enrolled 480 participants, randomized 1:1, with 240 in each arm.
  - id: E3
    text: After 12 weeks, 96 participants in the peloxatril arm had at least a 50% reduction in monthly migraine days.
  - id: E4
    text: In the placebo arm, 60 participants met the same 50% reduction threshold.
  - id: E5
    text: Serious adverse events occurred in 7 peloxatril participants and 5 placebo participants.
  - id: E6
    text: The trial ran at 23 sites in four countries.
  - id: E7
    text: Dropout was 9% in the peloxatril arm and 8% in the placebo arm.
